---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: cloud-qwen3.8-flash
spec:
  modelName: cloud-qwen3.8-flash
  params:
    # No native litellm orcarouter provider — route as OpenAI-compatible.
    model: qwen/qwen3.8-flash
    apiBase: https://api.orcarouter.ai/v1
    apiKeyRef:
      name: litellm-secrets
      key: LITELLM_ORCAROUTER_API_KEY
    dropParams: true
  info:
    mode: chat
    # Context/tools left unset: OrcaRouter /v1/models does not report them
    # for the free slugs — litellm falls back to its model cost map.
