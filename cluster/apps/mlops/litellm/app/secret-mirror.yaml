---
# Reader for the in-cluster Kubernetes ClusterSecretStore: lets
# external-secrets mirror operator-written key secrets from mlops into
# consumer namespaces (karakeep lives in selfhosted). Token is
# auto-populated by the control plane via the SA token secret annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-secret-reader
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secret-reader-token
  annotations:
    kubernetes.io/service-account.name: litellm-secret-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    # Least privilege: only the mirrored virtual-key secrets.
    resourceNames: ["karakeep-litellm-keys", "hermes-litellm-keys"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-secret-reader
subjects:
  - kind: ServiceAccount
    name: litellm-secret-reader
    namespace: mlops
