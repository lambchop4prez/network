apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes
spec:
  proxyRef: litellm
  keyAlias: Hermes
  # Dedicated secret: hermes-secrets is owned by the ExternalSecret
  # (creationPolicy: Owner) and would be clobbered on every sync.
  secretName: hermes-litellm-keys
  secretKey: LITELLM_API_KEY
