---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "honcho-cloudnative-pg"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: "honcho-pg-secret"
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      # Same key shape as components/postgres (username/password) so the app
      # could drop onto the shared component unchanged if its image ever gains
      # pgvector. DB_CONNECTION_URI is the SQLAlchemy URL Honcho requires;
      # urlquery keeps a password with URL-reserved characters valid.
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        DB_CONNECTION_URI: "postgresql+psycopg://{{ .username }}:{{ .password | urlquery }}@honcho-postgres17-rw.mlops.svc.servonet.lan:5432/honcho"
  data:
    - secretKey: username
      remoteRef:
        key: "HONCHO_PG_USER"
    - secretKey: password
      remoteRef:
        key: "HONCHO_PG_PASSWORD"
