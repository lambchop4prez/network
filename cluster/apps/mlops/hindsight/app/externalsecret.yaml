---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "hindsight-cloudnative-pg"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: "hindsight-pg-secret"
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: "HINDSIGHT_PG_USER"
    - secretKey: password
      remoteRef:
        key: "HINDSIGHT_PG_PASSWORD"
---
# Aggregate the chart's existingSecret: the official hindsight chart injects
# every key of api.existingSecret via envFrom, and requires `postgres-password`
# when postgresql.enabled=false. Both sources live in mlops (the kubernetes
# store pins remoteNamespace: mlops store-side) — the CNPG app-password secret
# and the litellm-operator-generated virtual key.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "hindsight-app-secret"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes
  target:
    name: "hindsight-app-secret"
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: hindsight-pg-secret
        property: password
    - secretKey: HINDSIGHT_API_LLM_API_KEY
      remoteRef:
        key: hindsight-litellm-key
        property: OPENAI_API_KEY
