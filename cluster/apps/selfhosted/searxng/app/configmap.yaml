---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
data:
  # Seeded by the seed initContainer into the writable /etc/searxng
  # emptyDir (default SEARXNG_SETTINGS_PATH) so the image keeps its
  # writable /etc/searxng. secret_key interpolates ${SEARXNG_SECRET}
  # from the process env (injected from searxng-secret). Add engine
  # tweaks here.
  settings.yml: |
    use_default_settings: true

    server:
      secret_key: "${SEARXNG_SECRET}"
      limiter: false
      image_proxy: true
      method: "GET"

    general:
      debug: false
      instance_name: "SearXNG"

    search:
      formats:
        - "html"
        - "json"
      safe_search: 0
      autocomplete: "duckduckgo"
      default_lang: "en-US"

    engines:
      # Tor-only engines fail to register without tor; disabled for clean logs.
      - name: "ahmia"
        disabled: true
      - name: "torch"
        disabled: true

    ui:
      static_use_hash: true
      query_in_title: true
      default_theme: simple
      results_on_new_tab: false

    enabled_plugins:
      - Basic Calculator
      - Hash plugin
      - Open Access DOI rewrite
      - Self Information
      - Tracker URL remover
      - Unit converter plugin

    outgoing:
      proxies:
        # Uncomment to route engine requests through the cluster egress proxy:
        # all: http://envoy-egress.networking.svc.cluster.local:8888
