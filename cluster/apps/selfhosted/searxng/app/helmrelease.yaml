---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app searxng
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    controllers:
      searxng:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            # Official image runs as the searxng user (UID/GID 977 in current
            # images; the old 8080 no longer exists in /etc/passwd and caused
            # root:UNKNOWN ownership warnings + crash-looping volume writes).
            runAsUser: 977
            runAsGroup: 977
            fsGroup: 977
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: docker.io/searxng/searxng
              tag: latest@sha256:a31763b7af3caf6ae9aac1816ba774214eb550252e06a4998f276ded8d60461b
            env:
              # settings.yml is seeded into the writable /etc/searxng emptyDir
              # by the seed initContainer (default SEARXNG_SETTINGS_PATH), so
              # the entrypoint can manage the rest of that directory.
              SEARXNG_BASE_URL: https://search.servonet.lan/
            envFrom:
              - secretRef:
                  name: searxng-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        initContainers:
          seed:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
            command:
              - /bin/sh
              - -c
            args:
              - |
                cp /config/settings.yml /etc/searxng/settings.yml
                chown 977:977 /etc/searxng/settings.yml
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      etc:
        type: emptyDir
        advancedMounts:
          searxng:
            app:
              - path: /etc/searxng
            seed:
              - path: /etc/searxng
      config:
        type: configMap
        name: searxng-config
        advancedMounts:
          searxng:
            seed:
              - path: /config
      cache:
        type: emptyDir
        advancedMounts:
          searxng:
            app:
              - path: /var/cache/searxng
    route:
      app:
        hostnames:
          - search.servonet.lan
        parentRefs:
          - name: envoy-internal
            namespace: networking
