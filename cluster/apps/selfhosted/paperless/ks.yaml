---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
  namespace: flux-system
spec:
  targetNamespace: selfhosted
  dependsOn:
    - name: external-secrets-manifests
    - name: cloudnative-pg
    - name: dragonfly
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/dragonfly/
    - ../../../../components/postgres/
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 10Gi
      # Match USERMAP_UID/USERMAP_GID so the kopia mover can read the volume
      VOLSYNC_PUID: 3004
      VOLSYNC_PGID: 3001
  path: ./cluster/apps/selfhosted/paperless/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: network
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
