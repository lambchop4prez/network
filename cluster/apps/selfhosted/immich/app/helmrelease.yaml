---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    controllers:
      server:
        forceRename: immich
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.4
            env:
              TZ: America/Detroit
              DB_HOSTNAME: immich-postgres17-rw.selfhosted.svc.servonet.lan
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-pg-secret
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-pg-secret
                    key: password
              DB_VECTOR_EXTENSION: vectorchord
              REDIS_HOSTNAME: immich-dragonfly.selfhosted.svc.servonet.lan
              REDIS_PORT: "6379"
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              # Transcoding: CPU-only on RK1. RKMPP needs the Rockchip BSP
              # kernel (mpp_service/rga), unavailable on Talos mainline —
              # see .tmp/external-context/talos/rk3588-vpu-and-node-labels.md
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

      machine-learning:
        forceRename: immich-machine-learning
        containers:
          main:
            # CPU inference (arm64 onnxruntime). HW acceleration is NOT
            # possible on the RK1 under Talos:
            # - rknn: librknnrt needs the vendor RKNPU driver >= 0.9.8
            #   (BSP kernel 5.10/6.1); Talos ships mainline + rocket.ko only,
            #   which librknnrt cannot bind to.
            # - armnn: needs /dev/mali0 + closed-source libmali blob; Talos
            #   uses panthor, no libmali.
            # If the V100 VM (docs/plans/v100-inference-stack.md) joins the
            # cluster, switch the tag to a -cuda build and nodeSelect it:
            #   tag: v3.2.4-cuda
            #   nodeSelector: { hardware/gpu: v100 }
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.2.4
            env:
              TZ: America/Detroit
              TRANSFORMERS_CACHE: /cache
              HF_XET_CACHE: /cache/huggingface-xet
              MPLCONFIGDIR: /cache/matplotlib-config
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 3Gi

    service:
      app:
        controller: server
        ports:
          http:
            port: &port 2283
      ml:
        controller: machine-learning
        ports:
          http:
            port: 3003

    persistence:
      library:
        existingClaim: immich
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/upload
      cache:
        existingClaim: immich-machine-learning-cache
        advancedMounts:
          machine-learning:
            main:
              - path: /cache

    route:
      app:
        hostnames:
          - immich.servonet.lan
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
