---
# Mirror the operator-generated virtual key from mlops (where the
# LiteLLMVirtualKey must live to reach the proxy) into selfhosted for the
# karakeep app container's envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-litellm-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes
  target:
    name: karakeep-litellm-key
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        # Source namespace (mlops) is pinned store-side: this ESO version's
        # remoteRef has no namespace field.
        key: karakeep-litellm-key
