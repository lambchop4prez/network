---
# Mirror the operator-generated virtual key from mlops (where the
# LiteLLMVirtualKey must live to reach the proxy) into selfhosted for the
# karakeep app container's envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-litellm-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes
  target:
    name: karakeep-litellm-keys
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: karakeep-litellm-keys
        # Kubernetes provider defaults to the consumer's namespace; the
        # operator writes the source into mlops.
        namespace: mlops
