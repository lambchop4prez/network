apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: karakeep
spec:
  proxyRef: litellm
  keyAlias: KaraKeep
  # Dedicated secret: karakeep-secret is owned by the ExternalSecret
  # (creationPolicy: Owner) and would be clobbered on every sync.
  secretName: karakeep-litellm-key
  secretKey: OPENAI_API_KEY
