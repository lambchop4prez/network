---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: flux-system
spec:
  targetNamespace: selfhosted
  dependsOn:
    - name: litellm
    - name: rook-cluster
    - name: external-secrets-manifests
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 10Gi
      # Keep volsync component defaults (3002) — the perfectra1n kopia mover
      # fails with permission denied on its staging volumes when overridden to
      # the image's runtime uid (10000). The app PVC still receives correct
      # ownership via its own fsGroup on first mount.
      VOLSYNC_PUID: "3002"
      VOLSYNC_PGID: "3002"
  path: ./cluster/apps/selfhosted/hermes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: network
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
