---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: hermes-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: HERMES_DISCORD_BOT_TOKEN
    - secretKey: DISCORD_APP_ID
      remoteRef:
        key: HERMES_DISCORD_APP_ID
    - secretKey: DISCORD_PUBLIC_KEY
      remoteRef:
        key: HERMES_DISCORD_PUBLIC_KEY
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: HERMES_API_SERVER_KEY
    # Injected as env so ${LITELLM_MASTER_KEY} in the seeded config.yaml
    # resolves without writing the key into /opt/data/.env.
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: LITELLM_MASTER_KEY
