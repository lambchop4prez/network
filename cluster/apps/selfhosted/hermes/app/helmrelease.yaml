---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    controllers:
      hermes:
        forceRename: hermes
        # NOTES:
        # - Do not override the image ENTRYPOINT and do not set
        #   pod.hostUsers: false — the s6-overlay /init must start as root to
        #   chown /opt/data, then drops to the runtime `hermes` user
        #   (UID/GID 10000) for every supervised service.
        # - args become CMD; the entrypoint dispatcher routes them to
        #   `hermes gateway run` (app container, s6-supervised) or
        #   `hermes dashboard` (dashboard container, main process).
        pod:
          securityContext:
            # fsGroup so the kopia mover (VOLSYNC_PUID/PGID) and the runtime
            # `hermes` user share ownership of /opt/data.
            fsGroup: 10000
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            args:
              - gateway
              - run
            env:
              API_SERVER_ENABLED: "true"
              # Kubelet probes cannot reach a loopback bind, so the API server
              # binds 0.0.0.0 inside the pod; API_SERVER_KEY (secret) guards
              # it. Reachable on the LAN via the LoadBalancer service below.
              API_SERVER_HOST: "0.0.0.0"
            envFrom:
              - secretRef:
                  name: hermes-secrets
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8642
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  failureThreshold: 24
                  periodSeconds: 5
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 2Gi
          dashboard:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            # `hermes dashboard` binds 127.0.0.1 by default; 0.0.0.0 is required
            # so envoy-internal can reach it. A non-loopback bind engages the
            # auth gate, which FAILS CLOSED at startup unless the basic-auth
            # env vars are present in hermes-secrets.
            args:
              - dashboard
              - --host
              - 0.0.0.0
              - --no-open
            env:
              # Host-header guard + OAuth callback origin behind envoy.
              HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.servonet.lan"
            envFrom:
              - secretRef:
                  name: hermes-secrets
            probes:
              liveness: &dashboardProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: &dashboardPort 9119
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *dashboardProbes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /api/status
                    port: 9119
                  failureThreshold: 24
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
        initContainers:
          seed:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            command:
              - /bin/sh
              - -c
            args:
              - |
                if [ ! -f /opt/data/config.yaml ]; then
                  cp /seed/config.yaml /opt/data/config.yaml
                  chown 10000:10000 /opt/data/config.yaml 2>/dev/null || true
                  echo "seeded /opt/data/config.yaml"
                else
                  echo "config.yaml already present; seed skipped"
                fi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.42.106
        externalTrafficPolicy: Local
        ports:
          http:
            port: *port
      dashboard:
        controller: *app
        ports:
          http:
            port: *dashboardPort
    route:
      dashboard:
        hostnames:
          - "hermes.servonet.lan"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: dashboard
                port: *dashboardPort
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            dashboard:
              - path: /opt/data
            seed:
              - path: /opt/data
      seed-config:
        type: configMap
        name: hermes-seed-config
        advancedMounts:
          hermes:
            seed:
              - path: /seed
