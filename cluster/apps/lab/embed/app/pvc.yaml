---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embed-lab-models
spec:
  accessModes: ["ReadWriteOnce"]
  # ceph-block is the reliable default; swap to openebs-hostpath (local disk)
  # if the ~0.5-1.2 GB model loads feel slow — it trades resilience for speed.
  storageClassName: ceph-block
  resources:
    requests:
      storage: 30Gi
