---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: embed-lab
  namespace: flux-system
spec:
  targetNamespace: lab
  dependsOn:
    - name: rook-cluster
  path: ./cluster/apps/lab/embed/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: network
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
