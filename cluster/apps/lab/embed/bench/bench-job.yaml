---
# One-shot NPU-vs-CPU prefill sweep across the candidate embedding models.
#
# Embeddings are pure prefill (one batched forward pass, no decode), so the
# prompt-processing rate llama-bench reports IS the embedding throughput to
# compare. ggml-rocket is scheduler-driven: the GGML_BACKEND_PATH arm runs the
# same binary with the NPU backend loaded, the `env -u` arm is the CPU baseline.
#
#   kubectl -n lab logs -f job/embed-lab-bench
#
# It reuses the embed-lab models PVC (RWO, same node) and downloads any model
# that is not already present. Deliberately no ttlSecondsAfterFinished: a TTL
# would delete the Job after it completes and Flux would immediately recreate
# and re-run it.
#
# F16 weights are used wherever published. ggml-rocket only offloads a
# quantized GGUF when the host's weight repack is OFF, and this llama-bench
# build (the pinned llama.cpp) exposes no repack flag at all — so a Q8_0 arm
# silently stays on the CPU and measures nothing (observed: Q8_0 NPU 133 t/s vs
# CPU 148 t/s, i.e. no win). F16 needs no repack and does offload (Qwen3-0.6B
# f16: NPU 122 vs CPU 78 t/s). embeddinggemma only ships Q8_0.
#
# No --repack/--no-repack: this llama-bench rejects it with
# "invalid parameter for argument: --repack".
#
# -ub 2048: encoder architectures (bert / xlm-r / gemma-embedding) assert
# "encoder requires n_ubatch >= n_tokens" and abort at pp2048 with the default
# ubatch, so the micro-batch is raised to match.
apiVersion: batch/v1
kind: Job
metadata:
  name: embed-lab-bench
  labels:
    app.kubernetes.io/name: embed-lab-bench
  annotations:
    # Shell loop vars ($spec/$file/$url, ${spec%%|*}); keep Flux from blanking
    # them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embed-lab-bench
    spec:
      restartPolicy: Never
      nodeSelector:
        npu.rocket-stack/enabled: "true"
      containers:
        - name: bench
          image: ghcr.io/lambchop4prez/rocket-runtime:v0.1.0
          command: ["bash", "-c"]
          args:
            - |
              set -uo pipefail
              status=0
              for spec in \
                "Qwen3-Embedding-0.6B-f16.gguf|https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-f16.gguf" \
                "Qwen3-Embedding-4B-f16.gguf|https://huggingface.co/Qwen/Qwen3-Embedding-4B-GGUF/resolve/main/Qwen3-Embedding-4B-f16.gguf" \
                "embeddinggemma-300M-Q8_0.gguf|https://huggingface.co/ggml-org/embeddinggemma-300M-GGUF/resolve/main/embeddinggemma-300M-Q8_0.gguf" \
                "mxbai-embed-large-v1_fp16.gguf|https://huggingface.co/ChristianAzinn/mxbai-embed-large-v1-gguf/resolve/main/mxbai-embed-large-v1_fp16.gguf" \
                "bge-m3-F16.gguf|https://huggingface.co/lm-kit/bge-m3-gguf/resolve/main/bge-m3-F16.gguf"; do
                file="${spec%%|*}"; url="${spec##*|}"
                f="/models/$file"
                if [ ! -s "$f" ]; then
                  echo "downloading $url"
                  if ! curl -fL --retry 5 --retry-all-errors -C - -o "$f.part" "$url"; then
                    echo "SKIP $file (download failed)"; status=1; continue
                  fi
                  mv "$f.part" "$f"
                fi
                echo "########## $file : NPU ##########"
                if ! GGML_BACKEND_PATH=/opt/rocket/libggml-rocket.so \
                     llama-bench -m "$f" -p 512,2048 -n 0 -r 3 -ub 2048; then
                  echo "llama-bench (NPU) failed for $file"; status=1
                fi
                echo "########## $file : CPU ##########"
                if ! env -u GGML_BACKEND_PATH \
                     llama-bench -m "$f" -p 512,2048 -n 0 -r 3 -ub 2048; then
                  echo "llama-bench (CPU) failed for $file"; status=1
                fi
              done
              echo "BENCH DONE (status=$status)"
              exit "$status"
          securityContext:
            privileged: true
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dev-accel
              mountPath: /dev/accel
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: embed-lab-models
        - name: dev-accel
          hostPath:
            path: /dev/accel
            type: Directory
