---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: step-issuer
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: step-issuer
      version: 1.11.0
      sourceRef:
        kind: HelmRepository
        name: smallstep
  dependsOn:
    - name: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    serviceAccount:
      create: true
    # The chart binds cert-manager's controller SA the `approve` permission on
    # the step signers; cert-manager's admission webhook requires it to let the
    # built-in approver stamp CertificateRequests for external signers.
    # Our cert-manager runs in kube-system, not the chart default namespace.
    certManager:
      serviceAccount:
        name: cert-manager
        namespace: kube-system
    # StepClusterIssuer is managed as a plain manifest in ../manifests so the
    # CA url/kid sit next to the ExternalSecret feeding the provisioner password.
    stepClusterIssuer:
      create: false
