---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-issuer-provisioner-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: step-issuer-provisioner-password
    creationPolicy: Owner
  data:
    # JWK provisioner password for the `cert-manager` provisioner on ca.lan.
    # Create as a Secret Manager key in the Bitwarden SM project used by the
    # bitwarden ClusterSecretStore.
    - secretKey: password
      remoteRef:
        key: STEP_ISSUER_PROVISIONER_PASSWORD
