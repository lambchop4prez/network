# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  interval: 1h
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/prometheus-community/smartctl-exporter
      tag: master # multi-arch; quay release tags are amd64-only (upstream issue)
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: false
