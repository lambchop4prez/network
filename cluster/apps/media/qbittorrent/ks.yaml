---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbittorrent
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 1Gi
  interval: 10m
  path: "./cluster/apps/media/qbittorrent/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: network
  wait: true
  dependsOn:
    - name: rook-cluster
  patches:
    # Bump the one-shot manual restore trigger now that CSI provisioning is
    # fixed and the kopia repository snapshots are reachable again.
    - patch: |-
        - op: replace
          path: /spec/trigger/manual
          value: restore-20261004
      target:
        kind: ReplicationDestination
