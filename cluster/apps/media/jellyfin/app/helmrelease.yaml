---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.1.0/charts/other/app-template/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
  namespace: media
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: jellyfin
  values:
    controllers:
      main:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
            env:
              TZ: "America/Detroit"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_FFmpeg__probesize: 50000000
              JELLYFIN_FFmpeg__analyzeduration: 500000000
            resources:
              requests:
                memory: 250Mi
                cpu: 20m
              limits:
                memory: 2500Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: &port 8096
    route:
      main:
        hostnames: ["jellyfin.servonet.lan"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        existingClaim: jellyfin
      movies:
        existingClaim: nas-movies
      tv:
        existingClaim: nas-tv
      music:
        existingClaim: nas-music
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /cache
