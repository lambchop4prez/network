---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
  namespace: media
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: qui
  values:
    controllers:
      main:
        initContainers:
          # volsync/kopia restores land files owned by the NAS kopia mover uid
          # (3002); qui needs to own its files to chmod its db. Fix ownership
          # here at startup instead of in the mover (mover uid 3002 is required
          # for the NAS kopia repository export).
          volume-permissions:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - /bin/sh
              - -c
              - chown -R 3000:3001 /config
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
        containers:
          main:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.34.0@sha256:e320bfff0780caff49fee18a6738659c629f863f2dd9347f32b41d287eddde25
            env:
              QUI__AUTH_DISABLED: true
              QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA: true
              QUI__AUTH_DISABLED_ALLOWED_CIDRS: 0.0.0.0/0
              QUI__HOST: 0.0.0.0
              QUI__PORT: &port 80
              TZ: "America/Detroit"
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3001
        fsGroup: 3001
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    route:
      main:
        hostnames:
          - "{{ .Release.Name }}.servonet.lan"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      config:
        existingClaim: qui
      downloads:
        existingClaim: nas-downloads
      movies:
        existingClaim: nas-movies
      tv:
        existingClaim: nas-tv
      archive:
        existingClaim: nas-archive
