---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qui
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 1Gi
      # match the app's uid/gid (helmrelease runAsUser/runAsGroup) so kopia
      # restores land files owned by the app user, not the mover default (3002)
      VOLSYNC_PUID: "3000"
      VOLSYNC_PGID: "3001"
  interval: 10m
  path: "./cluster/apps/media/qui/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: network
  wait: true
  dependsOn:
    - name: rook-cluster
    - name: qbittorrent
