---
# In-cluster store used to mirror secrets between namespaces (the litellm
# operator writes key secrets to mlops; consumers like karakeep live in
# selfhosted and envFrom cannot cross namespaces). NB: this external-secrets
# version takes server/caProvider as an object and pins the source namespace
# at store level (remoteNamespace) — ExternalSecret remoteRef has no
# namespace field.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes
  namespace: external-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: mlops
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: mlops
      auth:
        token:
          bearerToken:
            name: litellm-secret-reader-token
            key: token
            namespace: mlops
