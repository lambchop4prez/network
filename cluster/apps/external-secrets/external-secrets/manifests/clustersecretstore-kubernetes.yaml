---
# In-cluster store used to mirror secrets between namespaces (the litellm
# operator writes key secrets to mlops; consumers like karakeep live in
# selfhosted and envFrom cannot cross namespaces).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes
  namespace: external-secrets
spec:
  provider:
    kubernetes:
      server: https://kubernetes.default.svc
      caProvider:
        type: ConfigMap
        name: kube-root-ca.crt
        key: ca.crt
        namespace: mlops
      auth:
        serviceAccount:
          token:
            secretRef:
              name: litellm-secret-reader-token
              key: token
              namespace: mlops
