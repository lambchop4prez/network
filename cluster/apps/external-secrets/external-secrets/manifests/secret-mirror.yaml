---
# Prerequisites for the in-cluster 'kubernetes' ClusterSecretStore, which
# mirrors operator-written virtual keys from mlops into consumer namespaces
# (karakeep lives in selfhosted; envFrom cannot cross namespaces).
# NB: this ks pins targetNamespace: external-secrets, so these land there.
# Cross-namespace reads therefore need ClusterRole/ClusterRoleBinding; the
# resourceNames list keeps it scoped to the two virtual-key secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-secret-reader
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secret-reader-token
  annotations:
    kubernetes.io/service-account.name: litellm-secret-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litellm-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["karakeep-litellm-key", "hermes-litellm-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litellm-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litellm-secret-reader
subjects:
  - kind: ServiceAccount
    name: litellm-secret-reader
    namespace: external-secrets
