# ---
# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
#   name: servonet-external
# spec:
#   secretName: servonet-external-tls
#   issuerRef:
#     name: letsencrypt
#     kind: ClusterIssuer
#   commonName: "${EXTERNAL_DOMAIN}"
#   dnsNames:
#     - "${EXTERNAL_DOMAIN}"
#     - "*.${EXTERNAL_DOMAIN}"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: servonet-internal
spec:
  secretName: servonet-internal-tls
  issuerRef:
    group: certmanager.step.sm
    kind: StepClusterIssuer
    name: step
  commonName: "servonet.lan"
  # Wildcard: step-ca signs via the RA API, so no per-name HTTP-01 route.
  # Keep explicit apex + wildcard; add one-off names only if the CA ever
  # restricts this provisioner's SANs.
  dnsNames:
    - "servonet.lan"
    - "*.servonet.lan"
  # step-ca caps issuance at the provisioner's maxDur — the cert-manager
  # provisioner is created with --x509-max-duration 2160h (90d).
  duration: 2160h
  renewBefore: 720h

