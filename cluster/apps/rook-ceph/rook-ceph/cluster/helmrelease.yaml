---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  values:
    toolbox:
      enabled: true
    monitoring:
      enabled: true
    route:
      dashboard:
        enabled: true
        host:
          name: rook.servonet.lan
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: networking

    cephClusterSpec:
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      resources:
        mon:
          requests:
            cpu: 35m
            memory: 512Mi
          limits:
            memory: 768Mi
        osd:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi

      mgr:
        count: 1
        modules:
          - name: pg_autoscaler # This is already enabled by default, but needs to be here so that we don't override the default behavior.
            enabled: true
          - name: rook # This enables the rook module.
            enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
      network:
        provider: host
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          osdsPerDevice: "1"
        nodes:
          - name: "tom-7110"
            devices:
              - name: "/dev/disk/by-id/nvme-MTFDHBA1T0TDV-1AZ1AABHA_UJUNE01ZRG1SV1"

          - name: "tom-44dd"
            devices:
              - name: "/dev/disk/by-id/nvme-TEAM_TM8FP6001T_TPBF2308210070101183"

          - name: "tom-c86c"
            devices:
              - name: "/dev/disk/by-id/nvme-MTFDHBA1T0TDV-1AZ1AABHA_UJUNE01HPG8YYS"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      deletionPolicy: Delete
      isDefault: true
    cephFileSystems: []
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            erasureCoded:
              dataChunks: 2
              codingChunks: 1
          preservePoolsOnDelete: true
          gateway:
            port: 80
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
              instances: 1
          healthCheck:
            bucket:
              interval: 60s
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          parameters:
            region: us-east-1
