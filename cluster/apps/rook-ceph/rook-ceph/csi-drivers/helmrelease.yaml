---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
  namespace: rook-ceph
spec:
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
  interval: 1h
  dependsOn:
    - name: rook-ceph-cluster
  values:
    # Rook's operator already owns the CephConnection/ClientProfile for this cluster.
    cephConnections: []
    clientProfiles: []
    openshift:
      enabled: false
    operatorConfig:
      create: true
      name: ceph-csi-operator-config
      namespace: rook-ceph
      driverSpecDefaults:
        clusterName: rook-ceph
        imageSet:
          name: rook-csi-operator-image-set-configmap
        deployCsiAddons: false
        fsGroupPolicy: File
        nodePlugin:
          priorityClassName: system-node-critical
          kubeletDirPath: /var/lib/kubelet
          enableSeLinuxHostMount: false
        controllerPlugin:
          priorityClassName: system-cluster-critical
          deploymentStrategy:
            type: Recreate
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        # Enable the csi-snapshotter sidecar (volsync / csi-ceph-blockpool snapshot class).
        snapshotPolicy: volumeSnapshot
      cephfs:
        enabled: false
      nfs:
        enabled: false
      nvmeof:
        enabled: false
