[env]
TALOSCONFIG = "{{config_root}}/talosconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
KUBECONFIG = "{{config_root}}/kubeconfig"

_.file = ["{{config_root}}/.secrets.env"]

[hooks]
postinstall = "just setup"

[tools]
"python" = "3.14.8"
"aqua:casey/just" = "1.58.0"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cli/cli" = "2.102.0"
"aqua:cloudflare/cloudflared" = "2026.10.0"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.3.0"
"aqua:opentofu/opentofu" = "1.13.1"
"aqua:helmfile/helmfile" = "1.8.1"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:siderolabs/talos" = "1.14.2"
"aqua:yannh/kubeconform" = "0.8.0"
"github:bitwarden/sdk" = "bws-v1.0.0"
"aqua:derailed/k9s" = "0.51.0"
"aqua:charmbracelet/gum" = "2.0.2"
"aqua:mitsuhiko/minijinja" = "2.24.0"
"aqua:crate-ci/typos" = "1.50.3"
fnox = "1.38.1"
rust = "latest"
oxfmt = "0.72.0"
lefthook = "2.1.17"
# @yarnpkg/libzip@3.2.2 (transitive, Yarn support unused here) lacks provenance; published manually by arcanis. Review/remove exclusion if republished with provenance.
"npm:renovate" = { version = "44.148.3", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
zizmor = "1.30.1"
actionlint = "1.7.12"
gitleaks = "latest"
kopia = "latest"
